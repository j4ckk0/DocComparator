# error
error.doctype=it has a DOCTYPE, which Office never writes: refused, as it could make the reading fetch another file or reach the network
error.fetchRefused=refused to fetch {0}
error.fileTooLarge=larger than {0} MiB: refused
error.in={0}: {1}
error.noElement=it holds no XML element
error.noMainDocument={0} is neither a Word document nor an Excel workbook: it holds no main part
error.noPart=it has no part {0}
error.notPdf={0} is not a PDF: it does not start as one
error.notZip={0} is neither a Word document nor an Excel workbook: it is not a zip archive
error.pdfDamaged=its pages cannot be found: the file is damaged
error.pdfEncryption=it is encrypted in a way the program does not read
error.pdfFont=its text cannot be read: the font {0} does not say which characters it draws
error.pdfNoText=it holds no text: its pages are pictures (a scan?), which the program does not read
error.pdfPassword=it is protected by a password
