error.sheetTooLarge=too many cells to compare: sheet {0} takes the workbook beyond {1}
error.tooLarge=larger than {0} MiB once unzipped: refused
error.truncated=the XML ends inside an element
error.unreadable={0} cannot be read: {1}
error.wrongRoot=<{0}> where <{1}> was expected

