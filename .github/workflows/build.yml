# Build and test on every push and pull request: JDK 25 + Maven, then keep the jar as a workflow artefact (the
# distributions, with their runtime, are built by the release workflow on a tag, or by scripts/package.sh and .bat).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress package

      - name: Keep the jar
        uses: actions/upload-artifact@v4
        with:
          name: doccomparator.jar
          path: target/doccomparator.jar
          if-no-files-found: error
